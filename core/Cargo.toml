[package]
name = "nanyin-core"
version = "0.1.0"
edition = "2024"
description = "librespot bridge for the Nanyin macOS app, exposed to Swift as a C ABI"
publish = false

[lib]
name = "nanyin_core"
crate-type = ["staticlib", "rlib"]

# Upstream librespot, pinned to a dev-branch commit after 0.8.0 for
# in-memory credentials (#1802) and bounded handshake packets (#1807).
# Move every crate together.
[dependencies]
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "15e02e86c72d96dd39d548e3749f00abe39ffdde" }
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "15e02e86c72d96dd39d548e3749f00abe39ffdde" }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "15e02e86c72d96dd39d548e3749f00abe39ffdde" }
librespot-metadata = { git = "https://github.com/librespot-org/librespot", rev = "15e02e86c72d96dd39d548e3749f00abe39ffdde" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1

# Debug app builds still decode audio in real time: optimise dependencies,
# keep this crate quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
