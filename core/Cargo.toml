[package]
name = "nanyin-core"
version = "0.1.0"
edition = "2024"
description = "librespot bridge for the Nanyin macOS app, exposed to Swift as a C ABI"
publish = false

[lib]
name = "nanyin_core"
crate-type = ["staticlib", "rlib"]

# librespot from Nanyin's fork, natsustan/librespot branch `nanyin`: the
# dev-branch commit 15e02e8 after 0.8.0 (in-memory credentials #1802,
# bounded handshake packets #1807) plus, one commit each:
# - librespot-org/librespot#1765, playback kept across a dropped session;
# - a load whose audio key cannot be fetched fails instead of decoding the
#   encrypted file;
# - PlaybackSnapshot::track_uri and ::playing_on, a restore position that
#   advances until Spirc applies it;
# - Spirc::restore_playback_reporting, and no restore over another device
#   that was playing when this one registered;
# - the album id kept on a track's AudioItem (UniqueFields::Track::album_id).
# Every crate comes from the same rev, so one copy of each exists. Drop
# each change once upstream has it.
[dependencies]
librespot-core = { git = "https://github.com/natsustan/librespot", rev = "6b4fb2512707a650e61b455baa157482cfbbe65a" }
librespot-connect = { git = "https://github.com/natsustan/librespot", rev = "6b4fb2512707a650e61b455baa157482cfbbe65a" }
librespot-playback = { git = "https://github.com/natsustan/librespot", rev = "6b4fb2512707a650e61b455baa157482cfbbe65a" }
librespot-metadata = { git = "https://github.com/natsustan/librespot", rev = "6b4fb2512707a650e61b455baa157482cfbbe65a" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
http = "1"
log = "0.4"
env_logger = "0.11"
url = "2"
librespot-protocol = { git = "https://github.com/natsustan/librespot", rev = "6b4fb2512707a650e61b455baa157482cfbbe65a", version = "0.8.0" }
protobuf = "3"

[profile.release]
lto = true
codegen-units = 1

# Debug app builds still decode audio in real time: optimise dependencies,
# keep this crate quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
