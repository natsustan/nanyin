name: Nanyin
options:
  bundleIdPrefix: com.nanyin
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"
  configs:
    Release:
      ARCHS: arm64
      COPY_PHASE_STRIP: "YES"
      DEAD_CODE_STRIPPING: "YES"
      STRIP_INSTALLED_PRODUCT: "YES"

packages:
  ChouTiUI:
    path: research-repos/ChouTiUI
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.1

targets:
  Nanyin:
    type: application
    platform: macOS
    sources:
      - NanyinApp
    dependencies:
      - sdk: SystemConfiguration.framework
      - package: ChouTiUI
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nanyin.app
        PRODUCT_NAME: Nanyin
        MARKETING_VERSION: "0.1.4"
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Rust core (built by the script phase below)
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/build/rust/include"
        OTHER_LDFLAGS: "$(SRCROOT)/build/rust/lib/libnanyin_core.a"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: NanyinApp/Info.plist
        ENABLE_HARDENED_RUNTIME: "YES"
    preBuildScripts:
      - name: Build Rust Core
        script: |
          set -e
          export PATH="$HOME/.local/share/mise/shims:$HOME/.cargo/bin:$PATH"
          cd "$SRCROOT/rust"
          ./build.sh
        basedOnDependencyAnalysis: false
