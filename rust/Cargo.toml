[package]
name = "nanyin-core"
version = "0.1.0"
edition = "2021"
description = "librespot bridge for the nanyin macOS Spotify client (FFI to Swift)"

[lib]
name = "nanyin_core"
crate-type = ["staticlib"]

[dependencies]
librespot-audio = { path = "../research-repos/librespot/audio" }
librespot-core = { path = "../research-repos/librespot/core" }
librespot-connect = { path = "../research-repos/librespot/connect" }
librespot-playback = { path = "../research-repos/librespot/playback" }
librespot-metadata = { path = "../research-repos/librespot/metadata" }
librespot-protocol = { path = "../research-repos/librespot/protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
once_cell = "1.19"
serde_json = "1.0"
protobuf = "3.7"
http = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
bytes = "1"

[profile.release]
opt-level = 3
lto = true

# macOS 27 rejects misaligned LINKEDIT in stripped proc-macro dylibs
# (rust-lang/rust#157750). Keep build-time tools loadable; Xcode still strips
# the shipped app, and the core retains its optimized/LTO release profile.
[profile.release.build-override]
debug = 1
strip = "none"
