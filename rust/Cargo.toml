[package]
name = "nanyin-core"
version = "0.1.0"
edition = "2021"
description = "librespot bridge for the nanyin macOS Spotify client (FFI to Swift)"

[lib]
name = "nanyin_core"
crate-type = ["staticlib"]

[dependencies]
librespot-core = { path = "../research-repos/librespot/core" }
librespot-connect = { path = "../research-repos/librespot/connect" }
librespot-playback = { path = "../research-repos/librespot/playback" }
librespot-metadata = { path = "../research-repos/librespot/metadata" }
librespot-protocol = { path = "../research-repos/librespot/protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
once_cell = "1.19"
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
